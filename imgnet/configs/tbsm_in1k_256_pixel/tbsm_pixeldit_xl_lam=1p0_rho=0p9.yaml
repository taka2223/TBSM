experiment:
  save_dir: ./outputs/tbsm_in1k_256_pixel/tbsm_pixeldit_xl_lam=1p0_rho=0p9
  resume: ""
  init_weights: ${DM_MODEL_ZOO}/tbsm_release/pixeldit_xl_in1k_256_pixel_ema_backbone.pt

runtime:
  nproc_per_node: 8
  seed: 42
  deterministic: false

data:
  name: in1k
  data_dir: ${IMAGENET_DIR}
  resolution: 256
  num_classes: 1000
  num_workers: 8

network:
  name: pixeldit_xl
  params: {}
  adapter:
    source_prediction_type: velocity
    source_interpolation_direction: noise_to_data
    target_prediction_type: x
    target_interpolation_direction: data_to_noise

method:
  name: tbsm
  params:
    lambda: 1.0
    rho: 0.9
    feature_norm: ["mu", "std", "rms"]
    representation_fields:
      - representor:
          arch: mae_b
          input_size: 224
          ckpt_path: ${DM_MODEL_ZOO}/tbsm_release/mae_vit_b16_in1k_224.pth
          loss_weight: 1.0
      - representor:
          arch: siglip2_b
          input_size: 256
          ckpt_path: ${DM_MODEL_ZOO}/tbsm_release/siglip2_vit_b16_webli_256
          loss_weight: 1.0
      - representor:
          arch: resnet18
          input_size: 224
          ckpt_path: ${DM_MODEL_ZOO}/tbsm_release/torchvision_resnet18_in1k_224.pth
          loss_weight: 1.0
    trainer:
      gen_lr: 1.0e-5
      tracker_lr: 1.0e-3
      ema_decay: 0.999
      t_sampling: [1.0]
training:
  batch_size: 16
  total_steps: 500000
  bf16: true
  log_every: 50
  vis_every: 1000
  save_every: 5000

evaluation:
  checkpoint: ./outputs/tbsm_in1k_256_pixel/tbsm_pixeldit_xl_lam=1p0_rho=0p9/tbsm_step_100000.pt
  weights: ema
  batch_size: 64
  num_images: 50000
  seed: 1600
  dtype: bf16
  models:
    - inception
    - vit_large_patch16_224.mae
    - vit_large_patch14_dinov2.lvd142m
    - vit_large_patch14_clip_224.openai
    - vit_so400m_patch16_siglip_256.v2_webli
    - convnext
  no_prc: false
  eval_mmd: false
