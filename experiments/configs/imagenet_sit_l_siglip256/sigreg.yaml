experiment:
  save_dir: outputs/imagenet_sit_l_siglip256/sigreg_seed0
  resume: ''
  init_weights: data/pretrained/sit/SiT-L-2-256.pt
  strict_init: true
runtime:
  nproc_per_node: 1
  seed: 0
  deterministic: false
data:
  name: in1k_moments
  data_dir: ${IMAGENET_MOMENTS_DIR}
  resolution: 256
  num_classes: 1000
  num_workers: 4
latent:
  channels: 4
  downsample_ratio: 8
  multiplier: 0.18215
  decoder_path: ${SD_VAE_DECODER_PATH}
network:
  name: sit_l_2
  params:
    input_size: 32
    in_channels: 4
    learn_sigma: true
    class_dropout_prob: 0.1
  adapter:
    source_prediction_type: velocity
    source_interpolation_direction: noise_to_data
    target_prediction_type: x
    target_interpolation_direction: data_to_noise
method:
  name: tbsm
  params:
    lambda: 1.0
    rho: 0.9
    feature_norm:
    - mu
    - std
    - rms
    representation_fields:
    - representor:
        arch: siglip2_b
        input_size: 256
        ckpt_path: google/siglip2-base-patch16-256
        loss_weight: 1.0
    trainer:
      gen_lr: 1.0e-05
      tracker_lr: 0.001
      ema_decay: 0.999
      t_sampling:
      - 1.0
      - 0.5
      grad_accum_steps: 1
    field:
      type: sigreg
      directions: 2048
      bandwidth: 1.0
      chunk_size: 128
      seed: 20000
      scale: 43052.067763388004
training:
  batch_size: 32
  total_steps: 100000
  bf16: true
  log_every: 10
  vis_every: 5000
  save_every: 1000
  step_unit: optimizer_update
evaluation:
  batch_size: 16
  num_images: 10000
  every: 20000
  seed: 0
  weights: ema
  inception_path: ${INCEPTION_PATH}
  ref_stats_path: ${IMAGENET_REF_STATS_PATH}
  pickle_support_path: ${IMM_ROOT}
